databases:
  - name: pramaanai-db
    plan: free
    databaseName: pramaan
    user: pramaan

services:
  - type: web
    name: bordershield-pramaan-api
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pramaanai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: HMAC_SECRET_KEY
        generateValue: true
      # Must base64-decode to exactly 32 bytes (AES-256-GCM key) — Render's
      # generateValue doesn't guarantee that shape, so this one is set
      # manually in the dashboard after the first deploy from the blueprint.
      - key: ENCRYPTION_KEY
        sync: false
      # Shared login password for the two demo accounts (attari_officer /
      # OFFICER, officer1 / ADMIN) that scripts/seed_demo_users.py creates
      # on first boot. Change here (not in code) if you want a different
      # demo password.
      - key: DEMO_USER_PASSWORD
        value: BorderShield123
